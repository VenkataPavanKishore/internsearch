<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="navbar(activeTab)" class="navbar navbar-expand-lg navbar-custom sticky-top">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/}">
            <span class="fs-4">🎯</span>
            <span class="navbar-brand-title">InternSearch</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent"
                aria-controls="navContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-3">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activeTab == 'home'} ? 'active' : ''" th:href="@{/}">
                        <i class="bi bi-house-door me-1"></i> Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activeTab == 'internships'} ? 'active' : ''" th:href="@{/internships}">
                        <i class="bi bi-search me-1"></i> Discover Internships
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activeTab == 'skills'} ? 'active' : ''" th:href="@{/skills}">
                        <i class="bi bi-award me-1"></i> Resume Skills
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activeTab == 'companies'} ? 'active' : ''" th:href="@{/companies}">
                        <i class="bi bi-building me-1"></i> Search Companies
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activeTab == 'saved'} ? 'active' : ''" th:href="@{/saved}">
                        <i class="bi bi-bookmark-check me-1"></i> Saved
                    </a>
                </li>
            </ul>
            <div class="d-flex align-items-center gap-2">
                <a th:href="@{/skills}" class="btn btn-outline-primary btn-sm rounded-pill px-3">
                    <i class="bi bi-person-lines-fill me-1"></i> Manage Profile
                </a>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
